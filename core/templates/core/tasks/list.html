{% extends 'base.html' %}

{% block title %}Задачи — КружокAPP{% endblock %}

{% block content %}
<div class="app-content">
  <header class="page-header">
    <div>
      <h1 class="page-header__title">Задачи</h1>
      <p class="page-header__subtitle">Личные и командные задачи в одном списке</p>
    </div>
    <div class="page-header__actions">
      <button type="button" class="btn btn-primary"
              hx-get="{% url 'task_create' %}" hx-target="#task-modal" hx-swap="innerHTML">
        + Новая задача
      </button>
    </div>
  </header>

  <div id="task-modal"></div>

  <section class="panel">
    {% include 'core/tasks/list_items.html' %}
  </section>
</div>
{% endblock %}
