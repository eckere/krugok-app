{% extends 'base.html' %}

{% block title %}Проекты — КружокAPP{% endblock %}

{% block content %}
<div class="app-content">
  <header class="page-header">
    <div>
      <h1 class="page-header__title">Проекты</h1>
      <p class="page-header__subtitle">Курсы и рабочие направления команды</p>
    </div>
    <div class="page-header__actions">
      <button type="button" class="btn btn-primary"
              hx-get="{% url 'project_create' %}" hx-target="#project-modal" hx-swap="innerHTML">
        + Новый проект
      </button>
    </div>
  </header>

  <div id="project-modal"></div>

  <section class="panel">
    {% include 'core/projects/list_items.html' %}
  </section>
</div>
{% endblock %}
