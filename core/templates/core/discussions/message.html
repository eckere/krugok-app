<article class="message {% if message.sender == request.user %}message--mine{% endif %}">
  <div class="message__avatar">{{ message.sender.first_name|default:message.sender.username|first|upper }}</div>
  <div class="message__body">
    <div class="message__bubble">{{ message.text|linebreaksbr }}</div>
    <div class="message__meta">{{ message.sender.display_name }}, {{ message.created_at|date:"H:i" }}</div>
  </div>
</article>
