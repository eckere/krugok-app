{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}КружокAPP{% endblock %}</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- hx-headers прокидывает CSRF-токен во ВСЕ последующие HTMX-запросы автоматически -->
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="bg-gray-50">
    {% csrf_token %}

    <div id="auth-status" class="hidden text-sm text-red-600 p-2"></div>

    {% block content %}{% endblock %}

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const authStatus = document.getElementById('auth-status');
            if (authStatus) {
                authStatus.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
