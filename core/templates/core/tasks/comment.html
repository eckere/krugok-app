<article id="comment-{{ comment.id }}" class="comment">
  <div class="comment__avatar">{{ comment.author.first_name|default:comment.author.username|first|upper }}</div>
  <div class="comment__content">
    <div class="comment__header">
      <strong>{{ comment.author.display_name }}</strong>
      <time>{{ comment.created_at|date:'d.m.Y, H:i' }}</time>
    </div>
    <div class="comment__text">{{ comment.text|linebreaksbr }}</div>
  </div>
</article>
