{% load core_permissions %}
<article id="project-{{ project.id }}" class="entity-card project-card {% if compact %}project-card--compact{% endif %}">
  <div class="entity-card__content">
    <div class="entity-card__title-row">
      <div class="project-card__mark"></div>
      <h3 class="entity-card__title"><a href="{% url 'project_detail' project.id %}">{{ project.name }}</a></h3>
    </div>
    {% if project.description %}<div class="entity-card__description">{{ project.description }}</div>{% endif %}
    <div class="entity-card__meta">
      <span>Создан {{ project.created_at|date:'d.m.Y' }}</span>
    </div>
  </div>
  {% if not compact %}
    <div class="entity-card__actions">
      {% if project|can_admin_project:user %}
      <button type="button" hx-get="{% url 'project_update' project.id %}" hx-target="#project-modal" hx-swap="innerHTML" class="btn btn-secondary btn-sm">Изменить</button>
      <button type="button"
              hx-post="{% url 'project_archive' project.id %}"
              hx-target="#project-{{ project.id }}" hx-swap="outerHTML"
              hx-confirm="Архивировать проект «{{ project.name }}»?"
              class="btn btn-secondary btn-sm">
        В архив
      </button>
      {% endif %}
      {% if project|can_own_project:user %}
      <button type="button" hx-delete="{% url 'project_delete' project.id %}" hx-target="#project-{{ project.id }}" hx-swap="outerHTML" hx-confirm="Удалить проект «{{ project.name }}» навсегда?" class="btn btn-danger btn-sm">Удалить</button>
      {% endif %}
    </div>
  {% endif %}
</article>
