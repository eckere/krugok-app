<div class="modal-backdrop" data-modal-backdrop="project-modal">
<section id="project-form" class="modal-panel modal-panel--sm" role="dialog" aria-modal="true" aria-labelledby="project-form-title">
  <div class="modal-header">
    <h3 id="project-form-title" class="modal-title">{% if form.instance.pk %}Редактировать проект{% else %}Новый проект{% endif %}</h3>
    <button type="button" aria-label="Закрыть" data-close-modal="project-modal" class="modal-close">×</button>
  </div>

  <form method="post"
        hx-post="{% if form.instance.pk %}{% url 'project_update' form.instance.pk %}{% else %}{% url 'project_create' %}{% endif %}"
        {% if form.instance.pk %}
          hx-target="#project-{{ form.instance.pk }}" hx-swap="outerHTML"
        {% else %}
          hx-target="#project-list" hx-swap="beforeend"
        {% endif %}>
    {% csrf_token %}
    {% if return_to %}<input type="hidden" name="return_to" value="{{ return_to }}">{% endif %}
    <div class="form-grid">
      {% for field in form %}
        <div class="form-field form-field--full">
          <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="form-error">{{ field.errors|join:', ' }}</div>{% endif %}
        </div>
      {% endfor %}
    </div>
    <div class="form-actions">
      <button type="button" data-close-modal="project-modal" class="btn btn-ghost">Отмена</button>
      <button type="submit" class="btn btn-primary">Сохранить</button>
    </div>
  </form>
</section>
</div>
