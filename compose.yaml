name: krugok-app

services:
  web:
    image: krugok-app:latest
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-unknown}
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IPV4:-149.154.167.220}"
    volumes:
      - sqlite_data:/app/data
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host': os.environ['APP_DOMAIN'], 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  deadline-worker:
    image: krugok-app:latest
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-unknown}
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IPV4:-149.154.167.220}"
    command: ["sh", "/app/docker/deadline-worker.sh"]
    volumes:
      - sqlite_data:/app/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; p='/tmp/deadline-worker-heartbeat'; assert os.path.exists(p) and time.time()-os.path.getmtime(p) < max(90,int(os.environ.get('OUTBOUND_POLL_INTERVAL_SECONDS','5'))+60)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  backup-worker:
    image: krugok-app:latest
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-unknown}
    command: ["sh", "/app/docker/backup-worker.sh"]
    volumes:
      - sqlite_data:/app/data
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; p='/tmp/backup-worker-heartbeat'; assert os.path.exists(p) and time.time()-os.path.getmtime(p) < int(os.environ.get('BACKUP_INTERVAL_SECONDS','86400'))+600"
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
