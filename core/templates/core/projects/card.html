{% load core_permissions %}
<div id="project-{{ project.id }}" class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h3 class="font-semibold text-gray-900"><a href="{% url 'project_detail' project.id %}" class="hover:underline">{{ project.name }}</a></h3>
      {% if project.description %}<p class="mt-1 text-sm text-gray-600">{{ project.description }}</p>{% endif %}
      <p class="mt-2 text-xs text-gray-400">Создан {{ project.created_at|date:'d.m.Y' }}</p>
    </div>
    <div class="flex flex-wrap gap-2">
      {% if project|can_admin_project:user %}
      <button type="button" hx-get="{% url 'project_update' project.id %}" hx-target="#project-modal" hx-swap="innerHTML" class="rounded-md border border-gray-300 px-2 py-1 text-sm text-gray-700">Ред.</button>
      <button type="button"
              hx-post="{% url 'project_archive' project.id %}"
              hx-target="#project-{{ project.id }}" hx-swap="outerHTML"
              hx-confirm="Архивировать проект «{{ project.name }}»?"
              class="shrink-0 rounded-md border border-gray-300 px-2 py-1 text-sm text-gray-700">
        Архивировать
      </button>
      {% endif %}
      {% if project|can_own_project:user %}
      <button type="button" hx-delete="{% url 'project_delete' project.id %}" hx-target="#project-{{ project.id }}" hx-swap="outerHTML" hx-confirm="Удалить проект «{{ project.name }}» навсегда?" class="rounded-md border border-red-200 px-2 py-1 text-sm text-red-600">Удалить</button>
      {% endif %}
    </div>
  </div>
</div>
