<div id="project-form" class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
  <div class="mb-3 flex items-center justify-between">
    <h3 class="text-lg font-semibold text-gray-900">Новый проект</h3>
    <button type="button" onclick="document.getElementById('project-modal').innerHTML=''" class="text-sm text-gray-500">Закрыть</button>
  </div>

  <form method="post" hx-post="{% url 'project_create' %}" hx-target="#project-list" hx-swap="beforeend">
    {% csrf_token %}
    <div class="space-y-3">
      {% for field in form %}
        <div>
          <label class="mb-1 block text-sm font-medium text-gray-700">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="mt-1 text-sm text-red-600">{{ field.errors|join:', ' }}</div>{% endif %}
        </div>
      {% endfor %}
    </div>
    <div class="mt-4 flex gap-2">
      <button type="submit" class="rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white">Создать</button>
      <button type="button" onclick="document.getElementById('project-modal').innerHTML=''" class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-700">Отмена</button>
    </div>
  </form>
</div>
