<div class="modal-backdrop" onclick="if(event.target===this){document.getElementById('stage-modal').innerHTML=''}">
<section id="stage-form" class="modal-panel modal-panel--sm" role="dialog" aria-modal="true">
  <div class="modal-header">
    <h3 class="modal-title">{% if form.instance.pk %}Редактировать этап{% else %}Новый этап{% endif %}</h3>
    <button type="button" aria-label="Закрыть" onclick="document.getElementById('stage-modal').innerHTML=''" class="modal-close">×</button>
  </div>

  <form method="post"
        hx-post="{% if form.instance.pk %}{% url 'stage_update' form.instance.pk %}{% else %}{% url 'stage_create' project.id %}{% endif %}"
        {% if form.instance.pk %}
          hx-target="#stage-{{ form.instance.pk }}" hx-swap="outerHTML"
        {% else %}
          hx-target="#stage-list" hx-swap="beforeend"
        {% endif %}>
    {% csrf_token %}
    <div class="form-grid">
      {% for field in form %}
        <div class="form-field {% if field.name == 'name' %}form-field--full{% endif %}">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="form-error">{{ field.errors|join:', ' }}</div>{% endif %}
        </div>
      {% endfor %}
    </div>
    <div class="form-actions">
      <button type="button" onclick="document.getElementById('stage-modal').innerHTML=''" class="btn btn-ghost">Отмена</button>
      <button type="submit" class="btn btn-primary">Сохранить</button>
    </div>
  </form>
</section>
</div>
