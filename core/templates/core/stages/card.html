<div id="stage-{{ stage.id }}" class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <div class="flex items-center gap-2">
        <h3 class="font-semibold text-gray-900">{{ stage.name }}</h3>
        <span class="rounded-full bg-slate-100 px-2 py-1 text-xs font-medium text-slate-700">#{{ stage.order }}</span>
      </div>
      <div class="mt-2 flex flex-wrap gap-3 text-sm text-gray-500">
        <span>Статус: {{ stage.get_status_display }}</span>
        {% if stage.deadline %}<span>Дедлайн: {{ stage.deadline|date:'d.m.Y' }}</span>{% endif %}
      </div>
    </div>
    <div class="flex flex-wrap gap-2">
      <button type="button" hx-get="{% url 'stage_update' stage.id %}" hx-target="#stage-modal" hx-swap="innerHTML" class="rounded-md border border-gray-300 px-2 py-1 text-sm text-gray-700">Ред.</button>
      <button type="button" hx-post="{% url 'stage_archive' stage.id %}" hx-target="#stage-{{ stage.id }}" hx-swap="outerHTML" hx-confirm="Архивировать этап «{{ stage.name }}»?" class="rounded-md border border-gray-300 px-2 py-1 text-sm text-gray-700">Архив</button>
      <button type="button" hx-delete="{% url 'stage_delete' stage.id %}" hx-target="#stage-{{ stage.id }}" hx-swap="outerHTML" hx-confirm="Удалить этап «{{ stage.name }}»?" class="rounded-md border border-red-200 px-2 py-1 text-sm text-red-600">Удалить</button>
    </div>
  </div>
</div>
