<div id="task-dependent-fields" class="space-y-3">
  <div>
    <label class="mb-1 block text-sm font-medium text-gray-700">{{ form.stage.label }}</label>
    {{ form.stage }}
    {% if form.stage.errors %}
      <div class="mt-1 text-sm text-red-600">{{ form.stage.errors|join:', ' }}</div>
    {% endif %}
  </div>
  <div>
    <label class="mb-1 block text-sm font-medium text-gray-700">{{ form.assignee.label }}</label>
    {{ form.assignee }}
    {% if form.assignee.errors %}
      <div class="mt-1 text-sm text-red-600">{{ form.assignee.errors|join:', ' }}</div>
    {% endif %}
  </div>
</div>
