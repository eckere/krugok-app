<div id="comment-{{ comment.id }}" class="rounded-xl border border-gray-200 bg-slate-50 p-4 shadow-sm">
  <div class="text-sm text-slate-700">
    <div class="font-medium text-gray-900">{{ comment.author.get_full_name|default:comment.author.username }}</div>
    <div class="mt-2">{{ comment.text }}</div>
    <div class="mt-3 text-xs text-gray-500">{{ comment.created_at|date:'d.m.Y H:i' }}</div>
  </div>
</div>
