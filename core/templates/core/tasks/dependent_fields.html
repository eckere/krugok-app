<div id="task-dependent-fields" class="form-grid__contents">
  <div class="form-field">
    <label for="{{ form.stage.id_for_label }}" class="form-label">{{ form.stage.label }}</label>
    {{ form.stage }}
    {% if form.stage.errors %}
      <div class="form-error">{{ form.stage.errors|join:', ' }}</div>
    {% endif %}
  </div>
  <div class="form-field">
    <label for="{{ form.assignee.id_for_label }}" class="form-label">{{ form.assignee.label }}</label>
    {{ form.assignee }}
    {% if form.assignee.errors %}
      <div class="form-error">{{ form.assignee.errors|join:', ' }}</div>
    {% endif %}
  </div>
</div>
